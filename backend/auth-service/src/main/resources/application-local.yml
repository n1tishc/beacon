# Laptop defaults: matches the Postgres container in docker-compose.yml.
# Activate with SPRING_PROFILES_ACTIVE=local (or -Dspring-boot.run.profiles=local).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/beacon
    username: beacon
    password: beacon

beacon:
  auth:
    # ng serve runs on plain http://localhost; Safari refuses Secure cookies there.
    secure-cookie: false
    demo-users:
      enabled: true
      password: ${DEMO_USER_PASSWORD:beacon-demo}
