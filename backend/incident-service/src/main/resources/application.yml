# Base configuration. Anything environment-specific comes from env vars;
# the `local` profile supplies defaults for running on a laptop.
spring:
  application:
    name: incident-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: incident
  # Each service owns one schema in the shared database and never touches another's tables.
  flyway:
    schemas: incident
    default-schema: incident
  cloud:
    aws:
      # Credentials come from the default AWS chain: the EC2 instance role in AWS, env vars locally.
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        # A missing queue is a deployment error. Never let the app create one without its dead-letter queue.
        queue-not-found-strategy: fail
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys come from auth-service; tokens must also carry this issuer.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8082/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:beacon-auth}

beacon:
  alerts:
    queue: ${ALERT_QUEUE:beacon-alerts}
  notifications:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
    service-token: ${NOTIFICATION_SERVICE_TOKEN:}

# notification-service takes up to 7.5 s when Slack is failing (its own retries; see its
# application.yml), so one attempt here may take 10 s. All of it runs after the incident is saved,
# on a background thread: none of it delays an API response.
resilience4j:
  timelimiter:
    instances:
      notification-service:
        timeout-duration: 10s
  circuitbreaker:
    instances:
      notification-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException
        register-health-indicator: true
        # notification-service being down must not take incident-service out of service.
        allow-health-indicator-to-fail: false
  retry:
    instances:
      notification-service:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.util.concurrent.TimeoutException

server:
  port: ${PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
