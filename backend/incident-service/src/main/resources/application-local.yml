# Laptop defaults: matches the Postgres container in docker-compose.yml.
# Activate with SPRING_PROFILES_ACTIVE=local (or -Dspring-boot.run.profiles=local).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/beacon
    username: beacon
    password: beacon
  # LocalStack from docker-compose.yml (`docker compose up -d localstack`).
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566

beacon:
  notifications:
    service-token: local-service-token
