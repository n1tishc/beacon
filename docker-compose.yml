# Whole stack, one command:  docker compose up --build
# Every value has a working local default; copy .env.example to .env to override.
#
# Only `web` (the UI) and `gateway` (the API) are published to the host, plus LocalStack (the
# alert endpoint, and S3 for attachment uploads) and fake-slack, both on 127.0.0.1 only. The services behind the gateway are
# reachable only on the compose network, as they would be in production.
name: beacon

x-database-env: &database-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-beacon}
  DB_USERNAME: ${POSTGRES_USER:-beacon}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-beacon}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beacon}
      POSTGRES_USER: ${POSTGRES_USER:-beacon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beacon}
    ports:
      # 5433 on the host so it doesn't collide with a Postgres you may already run locally.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./backend
      args:
        SERVICE: auth-service
    environment:
      <<: *database-env
      # Optional PKCS#8 PEM. Without it auth-service generates a key at startup (fine locally).
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      DEMO_USERS_ENABLED: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-beacon-demo}
      # Local stack is plain http; Safari drops Secure cookies on http://localhost. Always true in AWS.
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  # AWS emulator for the alert pipeline: API Gateway -> Lambda -> SQS (+ DLQ). See infra/localstack.
  # Lambda functions run in sibling containers, so LocalStack needs the Docker socket. That is a
  # local-development convenience only; in AWS these are managed services (slice 7).
  localstack:
    build:
      context: ./infra/localstack
      additional_contexts:
        backend: ./backend
    environment:
      INGEST_API_KEY: ${INGEST_API_KEY:-local-ingest-key}
      AWS_DEFAULT_REGION: us-east-1
      ATTACHMENTS_BUCKET: ${ATTACHMENTS_BUCKET:-beacon-attachments}
      # The bucket's CORS rule lets only the web app's origin upload from a browser.
      WEB_ORIGIN: http://localhost:${WEB_PORT:-4200}
      # Check presigned-URL signatures as AWS does (LocalStack skips this by default), so a URL
      # signed for one file type or size is refused for another, locally too.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      # Lambda containers join the compose network so they can reach LocalStack's SQS.
      LAMBDA_DOCKER_NETWORK: beacon_default
    ports:
      # Bound to localhost only: this container can start other containers through the socket.
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Healthy once the init script has created the queue, the Lambda and the API.
      test: ["CMD", "test", "-f", "/tmp/beacon-ready"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  incident-service:
    build:
      context: ./backend
      args:
        SERVICE: incident-service
    environment:
      <<: *database-env
      AUTH_JWKS_URI: http://auth-service:8082/.well-known/jwks.json
      # The alert queue lives in LocalStack. LocalStack accepts any credentials; in AWS the
      # EC2 instance role provides real ones and no endpoint override is set.
      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-service-token}
      # Postmortem attachments, also in LocalStack. The service checks uploads over the compose
      # network, but signs URLs for the host the browser uses: the host is part of the signature.
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://localstack:4566
      S3_PUBLIC_ENDPOINT: http://localhost:${LOCALSTACK_PORT:-4566}
      S3_PATH_STYLE_ACCESS: "true"
      ATTACHMENTS_BUCKET: ${ATTACHMENTS_BUCKET:-beacon-attachments}
    # Deliberately no depends_on notification-service: incidents must work while it is down.
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  # Delivers incident notifications to Slack and the mock sink. Nothing depends on it starting.
  notification-service:
    build:
      context: ./backend
      args:
        SERVICE: notification-service
    environment:
      <<: *database-env
      AUTH_JWKS_URI: http://auth-service:8082/.well-known/jwks.json
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN:-local-service-token}
      # Unset: the fake Slack below. Empty: Slack off (mock sink only). Or a real webhook (a secret).
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL-http://fake-slack:8080/services/T0000/B0000/local-fake-slack}
      BEACON_PUBLIC_URL: http://localhost:${WEB_PORT:-4200}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  # Answers like a Slack incoming webhook. `docker compose stop fake-slack` simulates a Slack outage.
  fake-slack:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner"]
    volumes:
      - ./infra/fake-slack/mappings:/home/wiremock/mappings:ro
    ports:
      # Bound to localhost: its admin API (what was "posted") is for inspection only.
      - "127.0.0.1:${FAKE_SLACK_PORT:-8089}:8080"

  gateway:
    build:
      context: ./backend
      args:
        SERVICE: gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      INCIDENT_SERVICE_URL: http://incident-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      AUTH_JWKS_URI: http://auth-service:8082/.well-known/jwks.json
      # nginx (web) is the one proxy in front of the gateway.
      TRUSTED_PROXY_HOPS: "1"
      RATE_LIMIT_LOGIN_CAPACITY: ${RATE_LIMIT_LOGIN_CAPACITY:-10}
      RATE_LIMIT_API_CAPACITY: ${RATE_LIMIT_API_CAPACITY:-100}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: http://gateway:8080
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
